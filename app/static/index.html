<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudTec Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath d=%27M8 1l7 7-7 7-7-7z%27 fill=%27%232563eb%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card login-card">
      <div class="brand big"><span class="logo">◆</span> CloudTec Center</div>
      <p class="muted">Active Directory and vSphere in one console.</p>
      <label>Admin password
        <input type="password" id="login-password" autocomplete="current-password" required autofocus>
      </label>
      <p id="login-error" class="error"></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="logo">◆</span> CloudTec</div>
      <nav>
        <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
        <a href="#/directory" data-nav="directory">Active Directory</a>
        <a href="#/vsphere" data-nav="vsphere">vSphere</a>
        <a href="#/crosscheck" data-nav="crosscheck">Cross-check</a>
        <a href="#/powershell" data-nav="powershell"><img src="/static/powershell.svg" alt="" class="nav-icon"> PowerShell</a>
        <a href="#/connections" data-nav="connections">Connections</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
      <button id="logout" class="btn ghost small">Sign out</button>
    </aside>
    <main>
      <header class="topbar">
        <form id="global-search" class="search">
          <input type="search" id="global-q" placeholder="Search users, groups, computers and VMs everywhere…">
        </form>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="card modal-card">
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
